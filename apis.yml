name: Cuspai
description: 'CuspAI is a Cambridge, UK artificial intelligence company, founded in 2024,
  building generative AI for materials discovery. Its platform lets users specify desired
  physical and chemical properties — such as selective CO2 binding — and then generates,
  evaluates, and optimizes candidate molecular and material structures for applications
  spanning carbon capture, energy storage, catalysis, water purification, electric vehicles,
  and healthcare. CuspAI has raised roughly $130M (a $30M seed and a $100M Series A in
  September 2025) from investors including Northzone and Prosus Ventures, and maintains
  open-source scientific computing tooling on GitHub. As of mid-2026 the company operates
  a placeholder marketing site with no public API, developer portal, or SDK surface.'
